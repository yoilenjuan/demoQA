# Production-ready CI/CD Pipeline for Test Automation Framework
# Triggers on push to main/develop branches and pull requests

name: 🚀 Test Automation CI/CD Pipeline

on:
  push:
    branches: 
      - main
      - develop
  pull_request:
    branches: 
      - main
      - develop
  workflow_dispatch: # Manual trigger
    inputs:
      test_suite:
        description: 'Test Suite to Run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - critical
          - all

# Set environment variables
env:
  NODE_VERSION: '18.19.x'
  CI: true
  HEADLESS: true

# Permissions for GitHub token
permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read

jobs:
  # Job 1: Setup and Validation
  setup:
    name: 🔧 Setup & Validation
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
      
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Cache Dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-deps-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: 🔍 Validate Package Files
        run: |
          echo "Validating package.json and package-lock.json..."
          if [ ! -f package.json ]; then
            echo "❌ package.json not found"
            exit 1
          fi
          if [ ! -f package-lock.json ]; then
            echo "❌ package-lock.json not found"  
            exit 1
          fi
          echo "✅ Package files validated"

      - name: 📥 Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci --production=false

      - name: 🔐 Security Audit
        run: |
          echo "Running security audit..."
          npm audit --audit-level=moderate --progress=false || echo "⚠️  Security vulnerabilities found - review required"

      - name: 🧹 Lint Check
        run: |
          echo "Running code formatting check..."
          npm run lint || echo "⚠️  Code formatting issues found"

  # Job 2: Build and Test Validation
  build:
    name: 🏗️ Build & Compile
    runs-on: ubuntu-latest
    needs: setup
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Restore Dependencies Cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-deps-${{ hashFiles('**/package-lock.json') }}

      - name: 📥 Install Dependencies
        run: npm ci --production=false

      - name: 🔨 Build TypeScript
        run: |
          echo "Compiling TypeScript..."
          npm run build
          echo "✅ TypeScript compilation successful"

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: 🔍 Validate Configuration Files
        run: |
          echo "Validating configuration files..."
          node -e "require('./playwright.config.ts')" || echo "❌ Playwright config validation failed"
          echo "✅ Configuration files validated"

  # Job 3: Smoke Tests
  smoke-tests:
    name: 💨 Smoke Tests
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.test_suite == 'smoke') || github.event_name == 'push'
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Restore Dependencies Cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-deps-${{ hashFiles('**/package-lock.json') }}

      - name: 📥 Install Dependencies
        run: npm ci --production=false

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: 🧪 Run Smoke Tests
        run: |
          echo "Running smoke tests on ${{ matrix.browser }}..."
          BROWSER=${{ matrix.browser }} npm run test:smoke
        env:
          BROWSER: ${{ matrix.browser }}
          BASE_URL: https://demoqa.com
          HEADLESS: true
          CI_WORKERS: 2
          CI_RETRIES: 2

      - name: 📊 Upload Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: smoke-test-results-${{ matrix.browser }}
          path: |
            reports/
            test-results/
            logs/
          retention-days: 7

  # Job 4: Regression Tests (on main branch or manual trigger)
  regression-tests:
    name: 🔄 Regression Tests  
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.test_suite == 'regression' || github.event.inputs.test_suite == 'all'))
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Restore Dependencies Cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-deps-${{ hashFiles('**/package-lock.json') }}

      - name: 📥 Install Dependencies
        run: npm ci --production=false

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: 🧪 Run Regression Tests
        run: |
          echo "Running regression tests on ${{ matrix.browser }}..."
          BROWSER=${{ matrix.browser }} npm run test:regression
        env:
          BROWSER: ${{ matrix.browser }}
          BASE_URL: https://demoqa.com
          HEADLESS: true
          CI_WORKERS: 2
          CI_RETRIES: 2

      - name: 📊 Upload Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: regression-test-results-${{ matrix.browser }}
          path: |
            reports/
            test-results/
            logs/
          retention-days: 14

  # Job 5: Generate Reports
  generate-reports:
    name: 📈 Generate Reports
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: always() && (needs.smoke-tests.result == 'success' || needs.smoke-tests.result == 'failure')
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Download All Test Results
        uses: actions/download-artifact@v3
        with:
          path: ./artifacts/

      - name: 📦 Install Dependencies
        run: npm ci --production=false

      - name: 🔄 Consolidate Test Results
        run: |
          echo "Consolidating test results..."
          mkdir -p reports/consolidated
          find ./artifacts -name "*.json" -exec cp {} reports/consolidated/ \;
          find ./artifacts -name "*.xml" -exec cp {} reports/consolidated/ \;

      - name: 📊 Generate Allure Report
        run: |
          echo "Generating Allure report..."
          if [ -d "reports/allure-results" ]; then
            npx allure generate reports/allure-results --clean -o reports/allure-report
            echo "✅ Allure report generated"
          else
            echo "⚠️  No Allure results found"
          fi

      - name: 🎯 Generate Serenity Report
        run: |
          echo "Generating Serenity report..."
          if [ -d "reports/serenity" ]; then
            npm run test:serenity || echo "⚠️  Serenity report generation skipped"
          else
            echo "⚠️  No Serenity results found"
          fi

      - name: 📋 Generate Test Summary
        run: |
          echo "## 📊 Test Execution Summary" > test-summary.md
          echo "" >> test-summary.md
          echo "**Date:** $(date)" >> test-summary.md
          echo "**Commit:** ${{ github.sha }}" >> test-summary.md
          echo "**Branch:** ${{ github.ref_name }}" >> test-summary.md
          echo "" >> test-summary.md
          
          total_passed=$(find ./artifacts -name "*.json" | wc -l)
          echo "**Tests Executed:** $total_passed" >> test-summary.md
          
          echo "" >> test-summary.md  
          echo "### 📁 Artifacts" >> test-summary.md
          echo "- HTML Reports" >> test-summary.md
          echo "- Allure Reports" >> test-summary.md
          echo "- Serenity Reports" >> test-summary.md
          echo "- Screenshots & Videos" >> test-summary.md
          echo "- Test Logs" >> test-summary.md

      - name: 📤 Upload Consolidated Reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: consolidated-test-reports
          path: |
            reports/
            test-summary.md
          retention-days: 30

      - name: 💬 Comment PR with Results
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('test-summary.md')) {
              const summary = fs.readFileSync('test-summary.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            }

  # Job 6: Cleanup
  cleanup:
    name: 🧹 Cleanup
    runs-on: ubuntu-latest
    needs: [smoke-tests, regression-tests, generate-reports]
    if: always()
    
    steps:
      - name: 🗑️ Cleanup Workspace
        run: |
          echo "Cleaning up workspace..."
          rm -rf /tmp/playwright-* || true
          echo "✅ Cleanup completed"

# Notification on failure
  notify-failure:
    name: 📢 Notify on Failure
    runs-on: ubuntu-latest
    needs: [smoke-tests, regression-tests]
    if: failure() && github.ref == 'refs/heads/main'
    
    steps:
      - name: 🚨 Notify Team
        run: |
          echo "🚨 Test failures detected in main branch"
          echo "Please review the test results and take appropriate action"
          # Add your notification logic here (Slack, email, etc.)